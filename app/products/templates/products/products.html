{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">Список товарів</h1>

<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">
                    {{ product.name }}
                </h5>

                <p class="card-text">
                    Ціна: {{ product.price }} $
                </p>

                <a href="{{ url_for('products.product_detail', product_id=product.id) }}"
                   class="btn btn-primary">
                    Детальніше
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
