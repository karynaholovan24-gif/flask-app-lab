{% extends "base.html" %}

{% block content %}

<div class="row">
    <div class="col-md-3">
        <h5>Меню користувачів</h5>

        <nav class="nav flex-column">
            <a class="nav-link"
               href="{{ url_for('users.greetings', name='John', age=30) }}">
                John
            </a>

            <a class="nav-link"
               href="{{ url_for('users.greetings', name='Anna', age=20) }}">
                Anna
            </a>

            <a class="nav-link"
               href="{{ url_for('users.admin') }}">
                Адміністратор
            </a>
        </nav>
    </div>

    <div class="col-md-9">
        <h1>Привіт, {{ name }}!</h1>

        {% if age %}
            <p>Вік: {{ age }}</p>
        {% endif %}
    </div>
</div>

{% endblock %}
